services:
  postgres-compose:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: users-service
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data

  postgres-test:
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: user-service-test
    ports:
      - "5433:5432"
volumes:
  data:

networks:
  kafka-network:
    external: true